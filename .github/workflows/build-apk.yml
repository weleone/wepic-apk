name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.WEPIC_KEYSTORE_BASE64 }}" | base64 -d > wepic-release.jks

      - name: Build release APK
        env:
          WEPIC_KEYSTORE_PATH: ${{ github.workspace }}/wepic-release.jks
          WEPIC_KEYSTORE_PASSWORD: ${{ secrets.WEPIC_KEYSTORE_PASSWORD }}
          WEPIC_KEY_ALIAS: ${{ secrets.WEPIC_KEY_ALIAS }}
          WEPIC_KEY_PASSWORD: ${{ secrets.WEPIC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          ./gradlew :app:assembleRelease --no-daemon || gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wepic-apk
          path: app/build/outputs/apk/release/*.apk
