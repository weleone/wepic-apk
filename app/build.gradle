apply plugin: 'com.android.application'

android {
    namespace 'com.weleone.wepic'
    compileSdk 34

    defaultConfig {
        applicationId "com.weleone.wepic"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("WEPIC_KEYSTORE_PATH") ?: "wepic-release.jks")
            storePassword System.getenv("WEPIC_KEYSTORE_PASSWORD")
            keyAlias System.getenv("WEPIC_KEY_ALIAS") ?: "wepic"
            keyPassword System.getenv("WEPIC_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
