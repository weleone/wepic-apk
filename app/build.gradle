apply plugin: 'com.android.application'

android {
    namespace 'com.weleone.wepic'
    compileSdk 34

    defaultConfig {
        applicationId "com.weleone.wepic"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // 首版先不签名：编 unsigned release 验通再说，正式签名见 README
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
